<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UMB Audioplayer</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 12px;
    background: transparent;
    font-family: Verdana, Arial, sans-serif;
  }

  .player {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    background: #262626;
    border-radius: 8px;
    overflow: hidden;
  }

  .track {
    display: grid;
    grid-template-columns: 58px 1fr;
    gap: 12px;
    align-items: center;
    padding: 14px;
  }

  .track + .track {
    border-top: 1px solid #555;
  }

  .logo {
    width: 58px;
    height: 58px;
    background: #327b78;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 20px;
    border-radius: 4px;
  }

  .title {
    color: #70c3bd;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
    cursor: pointer;
  }

  audio {
    width: 100%;
    height: 32px;
  }
</style>
</head>

<body>

<div class="player">

  <div class="track">
    <div class="logo">UMB</div>
    <div>
      <div class="title" onclick="playTrack('track1')">
        Verrückt Nach Nudeln
      </div>
      <audio id="track1" controls>
        <source src="Verrueckt-Nach-Nudeln.mp3" type="audio/mpeg">
      </audio>
    </div>
  </div>

  <div class="track">
    <div class="logo">UMB</div>
    <div>
      <div class="title" onclick="playTrack('track2')">
        Ich Mach ’Ne Pause
      </div>
      <audio id="track2" controls>
        <source src="Ich-Mach-Ne-Pause.mp3" type="audio/mpeg">
      </audio>
    </div>
  </div>

</div>

<script>
const tracks = document.querySelectorAll("audio");

tracks.forEach(track => {
  track.addEventListener("play", () => {
    tracks.forEach(other => {
      if (other !== track) {
        other.pause();
      }
    });
  });
});

function playTrack(id) {
  const selected = document.getElementById(id);

  tracks.forEach(track => {
    if (track !== selected) {
      track.pause();
    }
  });

  selected.play();
}
</script>

</body>
</html>
